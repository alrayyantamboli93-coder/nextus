services:
  - type: web
    name: nextus-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_ONLY
        value: "true"
      - key: ADMIN_EMAILS
        value: alrayyantamboli93@gmail.com
      - key: CORS_ORIGINS
        value: https://nextus-nothing-c48a.vercel.app
      - key: APP_URL
        value: https://nextus-nothing-c48a.vercel.app
